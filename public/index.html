<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e31c23" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pascal" />
    <meta name="application-name" content="Pascal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Groupe Lave-auto Couche-Tard — cotisations mensuelles" />
    <title>Groupe Lave-auto Couche-Tard</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/favicon-32.png?v=19" type="image/png" sizes="32x32" />
    <link rel="icon" href="assets/favicon-16.png?v=19" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=19" sizes="180x180" />
    <link rel="icon" href="assets/icon-192.png?v=19" type="image/png" sizes="192x192" />
    <link rel="icon" href="assets/icon-512.png?v=19" type="image/png" sizes="512x512" />
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #06151c !important;
        color: #f0fbff !important;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
    </style>
    <link rel="stylesheet" href="styles.css?v=20260722-24" />
  </head>
  <body>
    <div class="startup-overlay" id="startupOverlay" role="status" aria-live="polite">
      <div class="startup-card">
        <div class="startup-logo startup-logo--owl">
          <img src="assets/hibou-seul.png?v=19" alt="" width="72" height="72" />
          <span class="logo-caption">Pascal</span>
        </div>
        <p class="eyebrow">Groupe Lave-auto Couche-Tard</p>
        <h2>Chargement</h2>
        <p id="startupMessage">Pr&eacute;paration du suivi mensuel…</p>
        <div class="startup-progress" aria-hidden="true">
          <span id="startupProgress"></span>
        </div>
      </div>
    </div>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="logo-card logo-card--owl">
            <img class="group-logo" src="assets/hibou-seul.png?v=19" alt="Logo Pascal — Lave-auto Couche-Tard" width="72" height="72" />
            <span class="logo-caption">Pascal</span>
          </div>
          <div>
            <p class="eyebrow">Abonnement mensuel · 9 membres</p>
            <h1>Groupe Lave-auto Couche-Tard</h1>
          </div>
        </div>
        <div class="status-strip">
          <span id="lastUpdated">Derni&egrave;re mise &agrave; jour: …</span>
        </div>
      </header>

      <main class="dashboard">
        <section class="sheet-only">
          <article class="panel">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">Feuille du groupe</p>
                <h2>Pr&eacute;nom, nom et solde</h2>
              </div>
              <span class="pill" id="paidPill">0 pay&eacute;s</span>
            </div>
            <div class="participant-list balance-table" id="participantList"></div>
          </article>
          <!-- détail participant masqué (garde les ids pour le JS admin) -->
          <div hidden>
            <h2 id="detailTitle">Participant</h2>
            <span id="detailStatus">—</span>
            <div id="memberDetail"></div>
          </div>
        </section>

        <section class="content-grid">
          <article class="panel">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">Historique</p>
                <h2>Paiements et retraits</h2>
              </div>
            </div>
            <div class="history-list" id="historyList"></div>
          </article>

          <article class="panel admin-panel admin-panel--simple" id="adminPanel">
            <div class="panel-heading admin-heading-simple">
              <div>
                <p class="eyebrow">Administrateur</p>
                <h2>Pascal</h2>
              </div>
              <button class="ghost-button compact-button" id="adminToggle" type="button">Mode Admin</button>
            </div>
            <!-- formulaires admin masqués (ids conservés pour le JS) -->
            <div hidden>
              <div id="adminLocked"></div>
              <div id="adminContent"></div>
              <form id="paymentForm">
                <select id="payMember"></select>
                <input id="payMonth" type="month" />
                <input id="payAmount" type="number" value="39.60" />
                <input id="payDate" type="date" />
                <select id="payMode"><option>Interac</option></select>
                <input id="payNote" type="text" />
                <button id="markAllPaid" type="button"></button>
              </form>
              <form id="memberForm">
                <select id="editMember"></select>
                <input id="editName" type="text" />
                <select id="editActive"><option value="true">Oui</option><option value="false">Non</option></select>
              </form>
              <form id="settingsForm">
                <input id="settingFee" type="number" />
                <input id="settingDueDay" type="number" />
                <button id="exportData" type="button"></button>
                <button id="importData" type="button"></button>
                <input id="importFile" type="file" accept="application/json,.json" />
              </form>
              <p id="adminNote"></p>
            </div>
          </article>
        </section>

      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js?v=20260722-24"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
